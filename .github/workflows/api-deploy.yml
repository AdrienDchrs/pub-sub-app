name: Build and deploy API

on: 
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_EF_VERSION: "9.0"
  PROJECT_FOLDER: "pub-sub-app"
  PROJECT_NAME: "myapp"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 9.0 SDK
        run: |
          # Télécharger la clé GPG pour Microsoft
          wget https://packages.microsoft.com/keys/microsoft.asc
          sudo apt-key add microsoft.asc

          # Ajouter le dépôt pour Ubuntu 24.04
          echo "deb [arch=amd64] https://packages.microsoft.com/ubuntu/24.04/prod stable main" | sudo tee /etc/apt/sources.list.d/dotnet-prod.list

          # Mettre à jour les informations du dépôt
          sudo apt-get update

          # Installer .NET 9.0 SDK
          sudo apt-get install dotnet-sdk-9.0

          # Vérifier l'installation du SDK
          dotnet --version

      - name: install dotnet ef
        run: dotnet tool install -g dotnet-ef --version ${{env.DOTNET_EF_VERSION}}
      
      - name: dotnet bundle migration
        run: dotnet ef migrations bundle --runtime linux-x64 -p ${{env.PROJECT_FOLDER}}/${{env.PROJECT_NAME}}.csproj -o ${{env.PROJECT_FOLDER}}/myapp/migrate

      - name: dotnet build
        run: dotnet build

      - name: dotnet publish
        run: dotnet publish --configuration Release --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v3
        with:
          name: publish-artifact
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v3
        with:
          name: publish-artifact

      - name: Deploy to Azure web app
        uses: azure/webapps-deploy@v2
        with:
          app-name: myapp
          package: ./publish
